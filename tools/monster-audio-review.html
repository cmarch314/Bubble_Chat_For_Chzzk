.source button.play{width:30px;height:30px;border:1px solid var(--line2);border-radius:7px;background:#172131;color:#fff}.source-meta{min-width:0}.source-meta strong{display:block;font:11px ui-monospace,monospace;color:#c8d2e1}.source-meta small{display:block;color:#7f8ca0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot-pick{height:30px;border:1px solid #52705f;border-radius:7px;background:#173025;color:#9ce9be;padding:0 8px;font-size:11px;font-weight:900}.slot-pick:disabled{opacity:.35}.assigned-source{box-shadow:inset 3px 0 var(--green);background:#14231f}.no-file{opacity:.5}

.group-assign{height:30px;border:1px solid #6b5b2a!important;background:#322a10!important;color:#ffe087!important;font-weight:900}.source-include{width:17px;height:17px;accent-color:var(--green);cursor:pointer}.source.excluded-source{opacity:.42}.source{grid-template-columns:20px 34px 1fr auto}

<body>
<header class="app-header">
  <div class="brand"><span class="brand-icon">🔊</span><div><strong>패턴 사운드 매핑</strong><small>패턴 슬롯 매핑 · 모션 타임라인 기준</small></div></div>
  <select id="monster" class="monster-select" aria-label="몬스터 선택"></select>
  <div class="header-progress"><span id="summary">불러오는 중…</span><span class="progress-track"><i id="progressFill"></i></span><b id="progressText">0%</b></div>
  <button id="completeReview" class="complete" type="button">검수 완료</button>
</header>
<main class="workspace">
  <aside class="rail pattern-rail"><div class="rail-head"><strong>1. 패턴 선택</strong><small id="patternSummary">패턴을 불러오는 중</small></div><nav id="patternList" class="pattern-list"></nav></aside>
  <section class="desk"><div id="patternDesk" class="empty">왼쪽에서 패턴을 선택하세요.</div><section class="combat-preview"><header><b>실수렵 모션 미리보기</b><span class="preview-controls"><select id="previewTarget"><option value="auto">자동 타겟</option><option value="0">헌터 1</option><option value="1">헌터 2</option><option value="2">헌터 3</option><option value="3">헌터 4</option></select><select id="previewState"><option value="normal">일반</option><option value="enraged">분노</option><option value="exhausted">탈진</option><option value="airborne">비행</option></select></span></header><div id="previewStage" class="preview-stage"><iframe id="patternPreviewFrame" src="http://127.0.0.1:8085/?embed=1" title="실수렵 패턴 미리보기"></iframe></div></section></section>
  <aside class="rail source-rail" aria-label="3. 구성 음원 후보"><div class="source-tools"><input id="sourceSearch" placeholder="이벤트·파일 검색"><select id="scopeFilter"><option value="all">전체 후보</option><option value="voice">VO 전용</option><option value="sound-effect">범용 SE</option><option value="reviewed">분류 완료</option><option value="unreviewed">미분류</option></select></div><div id="sourceList" class="source-list"></div></aside>
</main>
<div class="player"><div class="now"><b id="nowTitle">재생할 후보를 선택하세요</b><small id="nowMeta">이벤트 묶음과 실제 패턴 슬롯을 나란히 검수합니다.</small></div><audio id="audio" controls preload="none"></audio></div>
<script>
const state={monster:'',monsters:[],groups:[],presets:{},patterns:[],huntId:'',selectedPatternId:'',selectedSlot:'',selectedBeatId:'',queue:[],queueIndex:0,playingButton:null,apiVersion:0};
const audio=document.querySelector('#audio'),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const primaryPresets=new Set(['roar','breath','physical']);
const fileName=path=>String(path||'').split('/').pop();
const category=tags=>Object.entries(state.presets).find(([,p])=>p.tags.length===tags.length&&p.tags.every(t=>tags.includes(t)))?.[0]||(tags.length?'custom':'');
const selectedPattern=()=>state.patterns.find(p=>p.id===state.selectedPatternId)||state.patterns[0]||null;
const selectedSlot=()=>selectedPattern()?.slots.find(s=>s.slot===state.selectedSlot)||null;
const slotFile=slot=>(slot?.effective?.layers?.[0]||[])[0]||null;
const allSlots=()=>state.patterns.flatMap(pattern=>pattern.slots);
const mappedCount=()=>allSlots().filter(slot=>slot.effective).length;
function phaseIcon(phase){return({telegraph:'⚠',start:'▶',launch:'🔥',travel:'➜',impact:'💥',recovery:'◌',roar:'📢',burrow:'☁'})[phase]||'♪'}
function renderProgress(){const total=allSlots().length,mapped=mappedCount(),pct=total?Math.round(mapped/total*100):0;$('#summary').textContent=`${mapped}/${total} 슬롯`;$('#progressText').textContent=pct+'%';$('#progressFill').style.width=pct+'%';$('#patternSummary').textContent=`${state.patterns.length}개 · ${mapped}/${total} 연결`}
function renderMonsterOptions(){const select=$('#monster'),selected=state.monster||select.value;select.textContent='';const sections=[['미완료',state.monsters.filter(m=>m.reviewStatus!=='completed')],['검수 완료',state.monsters.filter(m=>m.reviewStatus==='completed')]];for(const [label,items] of sections){if(!items.length)continue;const group=document.createElement('optgroup');group.label=`${label} · ${items.length}마리`;for(const monster of items){const option=document.createElement('option');option.value=monster.id;option.textContent=`${monster.name} · ${monster.groups}묶음${monster.reviewStatus==='completed'?' · 완료 ✓':''}`;group.appendChild(option)}select.appendChild(group)}if(selected&&state.monsters.some(m=>m.id===selected))select.value=selected}
function renderCompletion(){const monster=state.monsters.find(m=>m.id===state.monster),button=$('#completeReview'),silent=monster?.reviewStatus==='silent-voice',done=monster?.reviewStatus==='completed';button.disabled=!monster||silent;button.classList.toggle('completed',done||silent);button.textContent=silent?'음성 없음 ✓':done?'검수 완료 ✓':'검수 완료'}
function renderPatternList(){const root=$('#patternList');root.textContent='';for(const pattern of state.patterns){const mapped=pattern.slots.filter(slot=>slot.effective).length,row=document.createElement('div'),button=document.createElement('button'),play=document.createElement('button');row.className='pattern-row';button.className='pattern-button'+(pattern.id===state.selectedPatternId?' active':'')+(mapped===pattern.slots.length?' complete-pattern':'');button.innerHTML=`<strong>${esc(pattern.name)}</strong><small>${esc(pattern.id)}</small><span class="count">${mapped}/${pattern.slots.length}</span>`;button.onclick=()=>selectReviewPattern(pattern,false);play.className='pattern-play';play.type='button';play.textContent='▶';play.title=`${pattern.name} 재생`;play.setAttribute('aria-label',`${pattern.name} 재생`);play.onclick=()=>selectReviewPattern(pattern,true);row.append(button,play);root.appendChild(row)}renderProgress()}
function selectReviewPattern(pattern,autoplay){state.selectedPatternId=pattern.id;if(!pattern.slots.some(s=>s.slot===state.selectedSlot))state.selectedSlot=pattern.slots[0]?.slot||'';state.selectedBeatId='';renderPatternList();renderPatternDesk();renderSources();if(autoplay)requestAnimationFrame(playCurrentPreview)}
function routeHtml(slot){const current=slotFile(slot),route=slot?.effective,count=route?.layers?.length||0,mode=route?.mode==='random'?' · RANDOM':'';return current?`<b>현재 · ${esc(fileName(current))}${count>1?` 외 ${count-1}개`:''}${mode}</b>`:'<span class="missing">음원 미지정</span>'}

function editorDraft(pattern,timeline){const authored=new Map((pattern.motion||[]).map(beat=>[beat.beat,beat]));return Object.fromEntries(timeline.beats.map(beat=>{const source=authored.get(beat.id)||{};return[beat.id,{...source,ticks:beatTicks(beat.ticks)}]}))}
const optionHtml=(items,current)=>items.map(([value,label])=>`<option value="${esc(value)}"${String(current??'')===value?' selected':''}>${esc(label)}</option>`).join('');
function previewDraft(pattern,timeline,draft,options={}){const frame=$('#patternPreviewFrame'),monster=state.monsters.find(item=>item.id===state.monster),authoredMotion=Array.isArray(pattern.motion)&&pattern.motion.length;if(!frame?.contentWindow)return;frame.contentWindow.postMessage({type:'bubblechat:pattern-preview',monsterId:state.huntId,monster:{id:state.huntId,nameKO:monster?.name||state.huntId,filename:`${state.huntId}.png`},target:$('#previewTarget').value,state:$('#previewState').value,pattern:{...pattern,...(options.scrub?{runtimePreviewScrub:true}:{}),...(authoredMotion?{motion:timeline.beats.map(beat=>({...(draft[beat.id]||{}),beat:beat.id}))}:{})}},'http://127.0.0.1:8085')}
function renderTransformFields(host,beatId,draft){const value=draft[beatId]||{ticks:1},panel=host.querySelector('.transform-editor');panel.innerHTML=`<div class="transform-head"><b>이동 · 회전 · 이미지 변형</b><select class="beat-select">${Object.keys(draft).map(id=>`<option value="${esc(id)}"${id===beatId?' selected':''}>${esc(id)}</option>`).join('')}</select></div><div class="transform-grid"><label>시작 위치<select data-key="at">${optionHtml(ANCHOR_OPTIONS,value.at)}</select></label><label>끝 위치<select data-key="to">${optionHtml(ANCHOR_OPTIONS,value.to)}</select></label><label>X 이동<input data-key="offsetX" type="number" step="1" value="${Number(value.offsetX)||0}"></label><label>Y 이동<input data-key="offsetY" type="number" step="1" value="${Number(value.offsetY)||0}"></label><label>투명도<input data-key="opacity" type="number" min="0" max="1" step=".05" value="${value.opacity??1}"></label><label>절대 회전°<input data-key="rotation" type="number" step="1" value="${value.rotation??''}"></label><label>추가 회전°<input data-key="rotateBy" type="number" step="1" value="${value.rotateBy??''}"></label><label>가로 배율<input data-key="scaleX" type="number" min=".05" step=".05" value="${value.scaleX??1}"></label><label>세로 배율<input data-key="scaleY" type="number" min=".05" step=".05" value="${value.scaleY??1}"></label><label>회전축<input data-key="origin" value="${esc(value.origin||'50% 50%')}"></label><label>X 기울기°<input data-key="skewX" type="number" step="1" value="${value.skewX??0}"></label><label>Y 기울기°<input data-key="skewY" type="number" step="1" value="${value.skewY??0}"></label><label class="wide">이동 속도<select data-key="moveEasing">${optionHtml(EASING_OPTIONS,value.moveEasing||'smooth')}</select></label><label class="wide">회전 속도<select data-key="rotationEasing">${optionHtml(EASING_OPTIONS,value.rotationEasing||'smooth')}</select></label></div>`;panel.querySelector('.beat-select').onchange=event=>selectEditorPart({beatId:event.target.value,seek:true,refreshSources:true});panel.querySelectorAll('[data-key]').forEach(input=>input.oninput=()=>{const key=input.dataset.key,raw=input.value;if(['at','to'].includes(key))raw?value[key]=raw:delete value[key];else if(['origin','moveEasing','rotationEasing'].includes(key))value[key]=raw;else if(raw==='')delete value[key];else value[key]=Number(raw);previewDraft(selectedPattern(),selectedPattern().timeline,draft)})}
function installTimelineScrubber(pattern,timeline,host,draft,track){let cursor=track.querySelector('.scrub-cursor');if(!cursor){cursor=document.createElement('i');cursor.className='scrub-cursor';track.appendChild(cursor)}const beats=timeline.beats;const seek=ratio=>{const total=beats.reduce((sum,beat)=>sum+beatTicks(draft[beat.id]),0),progress=Math.max(0,Math.min(.999999,ratio)),tick=progress*total;let elapsed=0,index=0;for(;index<beats.length-1;index++){const length=beatTicks(draft[beats[index].id]);if(tick<elapsed+length)break;elapsed+=length}selectEditorPart({beatId:beats[index].id,progress,seek:true,refreshSources:true})};const seekEvent=event=>{const rect=track.getBoundingClientRect();seek((event.clientX-rect.left)/Math.max(1,rect.width))};track.onpointerdown=event=>{if(event.target.closest('.beat-handle'))return;event.preventDefault();track.setPointerCapture(event.pointerId);seekEvent(event);track.onpointermove=seekEvent;track.onpointerup=()=>{track.onpointermove=null}};[...track.querySelectorAll('.beat')].forEach((node,index)=>node.onclick=event=>{if(event.target.closest('.beat-handle'))return;event.stopPropagation();selectEditorPart({beatId:beats[index].id,seek:true,refreshSources:true})});host.querySelectorAll('.motion-field').forEach(node=>node.onclick=event=>{if(event.target.matches('input'))return;selectEditorPart({beatId:node.dataset.beat,seek:true,refreshSources:true})});selectEditorPart({beatId:state.selectedBeatId||beats[0].id,seek:false,refreshSources:false})}
const renderMotionEditorTransformBase=renderMotionEditor;
renderMotionEditor=function(pattern,timeline,host){renderMotionEditorTransformBase(pattern,timeline,host);const draft=editorDraft(pattern,timeline),desk=host.closest('#patternDesk'),track=desk.querySelector('.beat-track'),panel=document.createElement('div'),tickMap=()=>Object.fromEntries(Object.entries(draft).map(([id,value])=>[id,beatTicks(value)])),sync=()=>syncMotionVisual(desk,tickMap());state.previewMotion={patternId:pattern.id,timeline,draft};panel.className='transform-editor';host.appendChild(panel);renderTransformFields(host,timeline.beats[0]?.id,draft);installTimelineScrubber(pattern,timeline,host,draft,track);host.querySelectorAll('.motion-field input').forEach(input=>input.oninput=()=>{draft[input.dataset.beat].ticks=Math.max(1,Math.min(600,Math.round(Number(input.value)||1)));sync()});[...track.querySelectorAll('.beat-handle')].forEach((handle,index)=>handle.onpointerdown=event=>{event.preventDefault();event.stopPropagation();handle.setPointerCapture(event.pointerId);handle.classList.add('dragging');const startX=event.clientX,leftId=timeline.beats[index].id,rightId=timeline.beats[index+1].id,leftStart=beatTicks(draft[leftId]),rightStart=beatTicks(draft[rightId]),total=Object.values(draft).reduce((sum,value)=>sum+beatTicks(value),0),width=track.getBoundingClientRect().width;handle.onpointermove=move=>{const requested=Math.round((move.clientX-startX)/Math.max(1,width)*total),delta=Math.max(1-leftStart,Math.min(rightStart-1,requested));draft[leftId].ticks=leftStart+delta;draft[rightId].ticks=rightStart-delta;sync()};handle.onpointerup=()=>{handle.classList.remove('dragging');handle.onpointermove=null}});host.querySelector('.preview-motion').onclick=()=>playCurrentPreview();host.querySelector('.save-motion').onclick=async()=>{const button=host.querySelector('.save-motion');button.disabled=true;button.textContent='저장 중…';try{if(state.apiVersion<2)throw new Error('서버 재시작 필요 · 구버전 저장 차단됨');const saveBeats=Object.fromEntries([...host.querySelectorAll('.motion-field input')].map(input=>{const id=input.dataset.beat,ticks=Math.max(1,Math.min(600,Math.round(Number(input.value)||1)));draft[id].ticks=ticks;return[id,{...draft[id],ticks}]})),response=await fetch('/api/hunt-pattern-motion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({huntId:state.huntId,patternId:pattern.id,beats:saveBeats})}),result=await response.json();if(!response.ok)throw new Error(result.error||'저장 실패');for(const [id,value] of Object.entries(saveBeats))if(beatTicks(result.beats?.[id])!==value.ticks)throw new Error(`저장 검증 실패: ${id}`);await loadPatterns(pattern.id,state.selectedSlot);renderPatternList();renderPatternDesk()}catch(error){button.disabled=false;button.textContent=error.message}}};
function playCurrentPreview(){const pattern=selectedPattern(),motion=state.previewMotion;if(!pattern||motion?.patternId!==pattern.id)return;const ticks=Object.fromEntries(Object.entries(motion.draft).map(([id,value])=>[id,value.ticks])),track=$('#patternDesk .beat-track');previewPatternTimeline(pattern,motion.timeline,ticks,track);previewDraft(pattern,motion.timeline,motion.draft,{scrub:false})}
addEventListener('message',event=>{if(event.origin==='http://127.0.0.1:8085'&&event.data?.type==='bubblechat:pattern-preview-ready')playCurrentPreview()});
function resizePatternPreview(){const stage=$('#previewStage'),frame=$('#patternPreviewFrame');if(stage&&frame)frame.style.transform=`scale(${stage.clientWidth/1920})`}
new ResizeObserver(resizePatternPreview).observe($('#previewStage'));resizePatternPreview();
function showError(error){$('#patternDesk').className='empty';$('#patternDesk').textContent=error.message}
init().catch(showError);
</script>
