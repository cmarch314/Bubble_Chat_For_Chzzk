.slot-flow{gap:6px}.slot-card{grid-template-columns:38px 138px minmax(0,1fr) auto;gap:9px;min-height:54px;padding:7px 9px;border-radius:9px}.slot-order{width:32px;height:32px;font-size:10px}.slot-name strong{font-size:13px}.slot-name small{font-size:10px;margin-top:1px}.slot-route{padding:0}.route-summary{gap:5px}.route-files{display:grid;margin:4px 0 0}.slot-actions{gap:4px}.icon-button{height:31px;min-width:32px}
.motion-editor{margin-top:10px;padding-top:10px}.motion-toolbar{margin-bottom:7px}.motion-inputs{gap:5px}.motion-field{padding:6px}.motion-field input{height:28px}.motion-field small{margin-top:2px}.transform-editor{margin-top:9px;padding:0;border:0;background:transparent}.anchor-disclosure{margin:9px 0;border:1px solid #3c4d67;border-radius:9px;background:#0d1520}.anchor-disclosure>summary{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 11px;cursor:pointer;list-style:none}.anchor-disclosure>summary::-webkit-details-marker{display:none}.anchor-disclosure>summary:after{content:'⌄';margin-left:auto;color:#9caec5;font-weight:900}.anchor-disclosure[open]>summary{border-bottom:1px solid #304159;background:#142033}.anchor-disclosure[open]>summary:after{transform:rotate(180deg)}.anchor-disclosure summary b{font-size:12px;color:#eaf0f8}.anchor-disclosure summary span{color:#8392a7;font-size:10px}.anchor-disclosure .anchor-editor{margin:0;padding:10px;border:0;border-radius:0;background:transparent}.transform-grid{grid-template-columns:repeat(6,minmax(84px,1fr));gap:6px}.transform-grid label{font-size:9px}.transform-grid .wide{grid-column:span 2}.rotation-controls{grid-column:span 2}.source-tools{height:94px;padding:8px;grid-template-rows:35px 32px}.source-list{height:calc(100% - 94px)}.source-toggle-row button{font-size:9px}.event-group{margin-bottom:6px}.event-group summary{padding:8px}.source{padding:5px}
.source[draggable="true"]{cursor:grab}.source.dragging-source{opacity:.48;cursor:grabbing}
 .judgment-condition{display:flex;align-items:center;gap:4px;margin-top:4px;color:#9aa9bc;font-size:10px}.judgment-condition select{height:23px;min-width:66px;border:1px solid #5b653c;border-radius:5px;background:#172334;color:#fff}

<body>
<header class="app-header">
  <div class="brand"><span class="brand-icon">🔊</span><div><strong>패턴 사운드 매핑</strong><small>패턴 슬롯 매핑 · 모션 타임라인 기준</small></div></div>
  <div id="monsterPicker" class="monster-picker">
    <button id="monsterPickerToggle" class="monster-picker-toggle" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="taxon-icon">🐾</span><span><small>몬스터 선택</small><strong>불러오는 중…</strong></span><span class="chevron">▾</span></button>
    <section id="monsterPickerPanel" class="monster-picker-panel" aria-label="종별 몬스터 선택" hidden><div class="monster-picker-body"><nav id="monsterCategories" class="monster-category-list" aria-label="종족 분류"></nav><section class="monster-roster"><header class="monster-roster-head"><strong id="monsterRosterTitle">종을 선택하세요</strong><nav id="monsterStatuses" class="monster-status-list" aria-label="검수 상태"></nav></header><div id="monsterResults" class="monster-results" aria-live="polite"></div></section></div></section>
  </div>
  <div class="header-edit-actions" aria-label="모션 편집"><button class="undo-motion" type="button" title="되돌리기" disabled>↶</button><button class="redo-motion" type="button" title="되돌리기 취소" disabled>↷</button><button class="reset-motion" type="button" title="최근 저장 상태로 복원" disabled>최근 저장</button><button class="save-motion" type="button" disabled>저장</button></div>
  <div class="header-progress"><span id="summary">불러오는 중…</span><span class="progress-track"><i id="progressFill"></i></span><b id="progressText">0%</b></div>
  <button id="completeReview" class="complete" type="button">검수 완료</button>
</header>
<main class="workspace">
  <aside class="rail pattern-rail"><div class="rail-head"><strong>1. 패턴 선택</strong><small id="patternSummary">패턴을 불러오는 중</small></div><nav id="patternList" class="pattern-list"></nav></aside>
  <section class="desk"><div id="patternTitleHost"></div><section class="combat-preview"><header><b>실수렵 모션 미리보기</b><span class="preview-controls"><button type="button" id="anatomyToggle" class="anatomy-toggle">부위 위치·방향</button><select id="previewTarget"><option value="auto">자동 타겟</option><option value="0">헌터 1</option><option value="1">헌터 2</option><option value="2">헌터 3</option><option value="3">헌터 4</option></select><select id="previewState"><option value="normal">일반</option><option value="enraged">분노</option><option value="exhausted">탈진</option><option value="airborne">비행</option></select><span class="simulation-controls"><button type="button" id="simulationStart" class="simulation-start">⚔ 실전 시작</button><button type="button" id="simulationPause" disabled>Ⅱ</button><select id="simulationSpeed" disabled><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><button type="button" id="simulationReset" disabled>↺</button><output id="simulationStatus" class="simulation-status">패턴 모드</output></span></span></header><div id="previewStage" class="preview-stage"><iframe id="patternPreviewFrame" src="/preview/?embed=1" title="실수렵 패턴 미리보기"></iframe></div></section><div id="patternDesk" class="empty">왼쪽에서 패턴을 선택하세요.</div></section>
  <aside class="rail source-rail" aria-label="3. 구성 음원 후보"><div class="source-tools"><input id="sourceSearch" placeholder="이벤트·파일 검색"><select id="scopeFilter"><option value="all">전체 후보</option><option value="common">COMMON 범용 음향</option><option value="common-part-break">COMMON · 부위파괴</option><option value="common-items">COMMON · 아이템·폭탄</option><option value="voice">VO 전용</option><option value="sound-effect">몬스터 SE</option><option value="reviewed">분류 완료</option><option value="unreviewed">미분류</option></select><div class="source-toggle-row"><button id="sourceVisibilityToggle" type="button" aria-pressed="false">👁 모두 보임 끔</button><button id="linkedFirstToggle" type="button" aria-pressed="false">🔗 연결 우선 끔</button></div></div><div id="sourceList" class="source-list"></div></aside>
</main>
<div class="player"><div class="now"><b id="nowTitle">재생할 후보를 선택하세요</b><small id="nowMeta">이벤트 묶음과 실제 패턴 슬롯을 나란히 검수합니다.</small></div><audio id="audio" controls preload="none"></audio></div>
<script src="/js/effects/hunt/HuntRotationContract.js"></script>
<script src="/motion-authoring-contract.js"></script>
<script src="/review-state.js"></script>
<script src="/js/effects/hunt/data/MonsterPatternAudioRoutes.generated.js"></script>
<script src="/js/effects/hunt/data/MonsterPatternMotionOverrides.generated.js"></script>
<script src="/review-app.js"></script>
</body>
</html>
