<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Great Sword and Hammer Charge Preview</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/hunt-runtime.css">
  <style>
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 25%, #463727, #100d0b 70%); }
    main { position: absolute; inset: 0 0 15vh; display: grid; place-content: center; }
    h1 { margin: 0 0 44px; color: #f2d18b; text-align: center; font: 900 36px/1 sans-serif; letter-spacing: .08em; }
    .weapon-row { display: grid; grid-template-columns: 160px repeat(4, 270px); gap: 28px; align-items: center; margin-bottom: 28px; }
    .weapon-label { color: #fff1c5; font: 900 28px/1.3 sans-serif; text-align: right; }
    .charge-card { height: 250px; display: grid; place-items: center; align-content: center; gap: 22px; border: 2px solid #8f713d; border-radius: 18px; background: rgba(17,14,12,.9); box-shadow: 0 10px 30px #000; }
    .game-hunt-weapon-img-container { position: relative; width: 138px; height: 138px; --weapon-facing: 1; }
    .game-hunt-weapon-img { width: 138px; height: 138px; object-fit: contain; position: relative; z-index: 3; }
    .stage-label { color: #fff; font: 900 24px/1 sans-serif; text-shadow: 0 2px 4px #000; }
    footer { position: absolute; inset: auto 0 0; height: 15vh; display: grid; place-items: center; border-top: 2px dashed rgba(0,255,170,.45); background: rgba(0,0,0,.42); color: rgba(255,255,255,.58); font: 700 23px/1 sans-serif; }
  </style>
</head>
<body>
  <main data-testid="charge-preview">
    <h1>실제 무기 이미지 차징 색상 검사</h1>
    <section class="weapon-row" aria-label="대검 차징 단계">
      <div class="weapon-label">대검</div>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-great_sword weapon-charge-stage-0"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt=""></div><div class="stage-label">원본</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-great_sword weapon-charge-stage-1"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt=""></div><div class="stage-label">1차지 · 흰색</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-great_sword weapon-charge-stage-2"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt=""></div><div class="stage-label">2차지 · 노란색</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-great_sword weapon-charge-stage-3"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt=""></div><div class="stage-label">3차지 · 빨간색</div></article>
    </section>
    <section class="weapon-row" aria-label="해머 차징 단계">
      <div class="weapon-label">해머</div>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-hammer weapon-charge-stage-0"><img class="game-hunt-weapon-img" src="../../img/weapons/hammer.svg" alt=""></div><div class="stage-label">원본</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-hammer weapon-charge-stage-1"><img class="game-hunt-weapon-img" src="../../img/weapons/hammer.svg" alt=""></div><div class="stage-label">1차지 · 흰색</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-hammer weapon-charge-stage-2"><img class="game-hunt-weapon-img" src="../../img/weapons/hammer.svg" alt=""></div><div class="stage-label">2차지 · 노란색</div></article>
      <article class="charge-card"><div class="game-hunt-weapon-img-container weapon-hammer weapon-charge-stage-3"><img class="game-hunt-weapon-img" src="../../img/weapons/hammer.svg" alt=""></div><div class="stage-label">3차지 · 빨간색</div></article>
    </section>
  </main>
  <footer>OBS 채팅 전용 하단 15% 안전 영역</footer>
</body>
</html>
