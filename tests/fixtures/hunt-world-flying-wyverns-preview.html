<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,initial-scale=1">
  <title>월드 비룡 19종 검수</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/hunt-runtime.css">
  <style>
    *{box-sizing:border-box}
    html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 15%,#30372b,#080a08 74%);color:#fff}
    #preview{position:relative;width:1920px;height:918px;overflow:hidden}
    .review-head{position:absolute;z-index:30;top:24px;left:38px;right:38px;display:flex;align-items:center;justify-content:space-between}
    .review-title{font:1000 32px/1 sans-serif;color:#e7ffad;text-shadow:0 3px 10px #000}
    .review-count{font:900 24px/1 sans-serif;color:#f5d995}
    .review-meta{position:absolute;z-index:30;top:72px;left:40px;font:800 19px/1.35 sans-serif;color:#c8d3c4}
    #monster-name{font-size:30px;color:#fff}
    #move-name{color:#ffdf88}
    #monster-showcase-panel{position:absolute;z-index:12;inset:110px 0 260px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-motion-stage{position:relative;width:980px;height:510px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-attack-motion{width:410px;height:410px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-facing-layer{width:100%;height:100%;display:grid;place-items:center;overflow:visible}
    #fight-monster-img{width:410px;height:410px;object-fit:contain;filter:drop-shadow(0 28px 26px #000c)}
    #part-list{position:absolute;z-index:28;left:50%;top:126px;transform:translateX(-50%);display:flex;gap:10px;padding:9px 14px;border:2px solid #927b4d;background:#10150fdd;border-radius:10px}
    .part{min-width:62px;padding:7px 10px;border:2px solid #b69b62;border-radius:8px;text-align:center;font:900 17px/1 sans-serif;background:#261f13;color:#fff!important;opacity:1!important}
    .game-hunt-weapons-grid{position:absolute;z-index:8;left:45px;right:45px;bottom:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .game-hunt-weapon-card{position:relative;height:220px;border:3px solid #886f42;border-radius:12px;background:#111d;padding:8px;display:grid;place-items:center;overflow:visible}
    .game-hunt-weapon-img-container{position:relative;width:120px;height:120px}
    .game-hunt-weapon-img{width:120px;height:120px;object-fit:contain}
    .hunter-name{font:900 19px/1 sans-serif;color:#f2d8a5;white-space:nowrap}
    .chat-safe{height:162px;border-top:2px dashed #28d6a688;background:#020604e8;display:grid;place-items:center;color:#78d8ba;font:900 22px/1 sans-serif}
  </style>
</head>
<body>
  <main id="preview" class="game-hunt-card hunt-combat-board">
    <header class="review-head">
      <div class="review-title">월드 · 아이스본 비룡 19종 실전 동작 검수</div>
      <div id="review-count" class="review-count">1 / 19</div>
    </header>
    <div class="review-meta">
      <span id="monster-name"></span><br>
      <span id="move-name"></span>
    </div>
    <div id="part-list" aria-label="파괴 가능 부위"></div>
    <section id="monster-showcase-panel" class="game-hunt-monster-showcase">
      <div class="hunt-monster-motion-stage">
        <div class="hunt-monster-attack-motion">
          <div class="hunt-monster-pose-layer">
            <div class="hunt-monster-aim-layer"><div class="hunt-monster-facing-layer">
              <img id="fight-monster-img" class="game-hunt-monster-img" alt="">
            </div></div>
          </div>
        </div>
      </div>
    </section>
    <section class="game-hunt-weapons-grid">
      <article id="fight-card-0" class="game-hunt-weapon-card"><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt=""></div><div class="hunter-name">대검</div></article>
      <article id="fight-card-1" class="game-hunt-weapon-card"><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/lance.svg" alt=""></div><div class="hunter-name">랜스</div></article>
      <article id="fight-card-2" class="game-hunt-weapon-card"><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/hunting_horn.svg" alt=""></div><div class="hunter-name">수렵피리</div></article>
      <article id="fight-card-3" class="game-hunt-weapon-card"><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/bow.svg" alt=""></div><div class="hunter-name">활</div></article>
    </section>
  </main>
  <footer class="chat-safe">OBS 채팅 안전영역 · 하단 15%</footer>
  <script src="../../js/effects/hunt/data/ReviewedMonsterAnatomy.js"></script>
  <script src="../../js/effects/hunt/HuntAtbConfig.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterArchetypeCatalog.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterAnatomyCatalog.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterProfiles.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterAnimationCatalog.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterAttackAnimator.js"></script>
  <script>
    const roster=['diablos','black_diablos','tigrex','brute_tigrex','nargacuga','barioth','frostfang_barioth','rathian','pink_rathian','gold_rathian','rathalos','azure_rathalos','silver_rathalos','legiana','shrieking_legiana','paolumu','nightshade_paolumu','bazelgeuse','seething_bazelgeuse'];
    const names={diablos:'디아블로스',black_diablos:'디아블로스 아종',tigrex:'티가렉스',brute_tigrex:'티가렉스 아종',nargacuga:'나르가쿠르가',barioth:'베리오로스',frostfang_barioth:'서리칼날을 두른 베리오로스',rathian:'리오레이아',pink_rathian:'리오레이아 아종',gold_rathian:'금화룡 리오레이아',rathalos:'리오레우스',azure_rathalos:'리오레우스 아종',silver_rathalos:'은화룡 리오레우스',legiana:'레이기에나',shrieking_legiana:'얼려 찌르는 레이기에나',paolumu:'파오우르무',nightshade_paolumu:'파오우르무 아종',bazelgeuse:'바젤기우스',seething_bazelgeuse:'홍련의 솟구치는 바젤기우스'};
    const owner={card:document.getElementById('preview'),selectedMonster:null,animationTimers:{timeout(fn,ms){return setTimeout(fn,ms)},clear(id){clearTimeout(id)}}};
    const animator=new HuntMonsterAttackAnimator(owner,()=>{});
    const requestedMonster=new URLSearchParams(location.search).get('monster');
    const requestedAction=new URLSearchParams(location.search).get('action');
    let monsterIndex=Math.max(0,roster.indexOf(requestedMonster));
    let actionIndex=0;
    let previewTimer=null;
    function renderParts(id){
      const profile=HuntMonsterAnatomyCatalog.find({id});
      const parts=HuntMonsterAnatomyCatalog.partDisplaySlots(HuntMonsterAnatomyCatalog.createPartState(profile));
      document.getElementById('part-list').replaceChildren(...parts.map(part=>{
        const node=document.createElement('span');
        node.className='part';
        node.textContent={head:'머리',back:'등',wing:'날개',leg:'앞발',tail:'꼬리'}[part.kind]||part.kind;
        return node;
      }));
    }
    function showMonster(){
      const id=roster[monsterIndex];
      owner.selectedMonster={id,nameKO:names[id],species:'Flying Wyvern'};
      const image=document.getElementById('fight-monster-img');
      image.src=`../../img/monsters/${id}.png`;
      image.alt=names[id];
      document.getElementById('monster-name').textContent=names[id];
      document.getElementById('review-count').textContent=`${monsterIndex+1} / ${roster.length}`;
      renderParts(id);
      const patterns=window.HUNT_MONSTER_PATTERN_OVERRIDES?.[id]||HUNT_MONSTER_PATTERN_OVERRIDES[id]||[];
      actionIndex=Math.max(0,patterns.findIndex(pattern=>
        pattern.id===`${id}.${requestedAction}`||pattern.id===requestedAction));
      playAction();
    }
    function playAction(){
      const id=roster[monsterIndex];
      const patterns=window.HUNT_MONSTER_PATTERN_OVERRIDES[id]||[];
      if(!patterns.length)return;
      const pattern=patterns[actionIndex++%patterns.length];
      document.getElementById('move-name').textContent=pattern.name;
      const targets=Array.from({length:Math.max(1,Math.min(4,pattern.maxTargets||1))},(_,index)=>({index,result:index===3?'dodge':'hit'}));
      const trigger=()=>animator.triggerMonsterAttack(pattern.type,pattern.tags?.includes('ice')?'❄️':pattern.tags?.includes('fire')?'🔥':'💥',targets,pattern.name,pattern);
      if(previewTimer)clearTimeout(previewTimer);
      if(pattern.telegraphFx){
        animator.triggerMonsterTelegraphFx(pattern.telegraphFx);
        previewTimer=setTimeout(trigger,Number(pattern.telegraphFx.durationMs||800));
      }else trigger();
    }
    addEventListener('load',()=>{
      showMonster();
      if(!requestedAction)setInterval(playAction,3200);
      if(!requestedMonster)setInterval(()=>{monsterIndex=(monsterIndex+1)%roster.length;showMonster()},12800);
    });
  </script>
</body>
</html>
