<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hunt Command Reservation Preview</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 20%, #433423, #100d0b 66%); }
    .game-overlay-container { display: flex; align-items: flex-start; justify-content: center; height: 85vh; }
    .hunt-combat-board { position: relative; min-height: 790px; margin-top: 18px; }
    .preview-top { height: 74px; border: 2px solid #c5a059; border-radius: 20px; background: rgba(0,0,0,.65); }
    .preview-monster { height: 380px; display: grid; place-items: center; color: #fff; font: 900 38px/1 sans-serif; }
    .preview-hunters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .preview-hunter { height: 210px; border: 2px solid #c5a059; border-radius: 14px; background: rgba(0,0,0,.64); display: grid; place-items: center; color: #eee; font: 800 24px/1 sans-serif; }
    .preview-chat { position: fixed; inset: auto 0 0; height: 15vh; border-top: 2px dashed rgba(0,255,170,.45); background: rgba(0,0,0,.4); color: #aaa; display: grid; place-items: center; font: 700 22px/1 sans-serif; }
  </style>
</head>
<body>
  <main class="game-overlay-container">
    <section class="game-hunt-card hunt-combat-board">
      <div class="preview-top"></div>
      <div class="preview-monster">리오레우스 · 전투 진행 중</div>
      <div class="hunt-combat-reserve-commands" aria-label="참가 헌터 행동 예약 명령">
        <b>행동 예약</b><span>!물약, !가루, !숫돌, !점프, !귀환옥</span>
      </div>
      <div class="preview-hunters">
        <div class="preview-hunter">대검 헌터</div><div class="preview-hunter">수렵피리 헌터</div>
        <div class="preview-hunter">태도 헌터</div><div class="preview-hunter">쌍검 헌터</div>
      </div>
    </section>
  </main>
  <footer class="preview-chat">OBS 채팅 전용 하단 15%</footer>
</body>
</html>
