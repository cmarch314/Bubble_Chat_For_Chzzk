    html,body{width:1920px;height:1080px;margin:0;overflow:hidden}

    .monster-anatomy-guide{position:absolute;z-index:45;pointer-events:none;overflow:visible;transform-box:border-box}
    .monster-anatomy-guide .part-handle{pointer-events:all;cursor:grab}
    .monster-anatomy-guide .part-line{stroke:#5de1ff;stroke-width:4;filter:drop-shadow(0 0 4px #001b2c)}
    .monster-anatomy-guide .part-path{fill:none;stroke:#ffd467;stroke-width:5;stroke-dasharray:10 7}
    .monster-anatomy-guide .part-dot{fill:#08141d;stroke:#fff;stroke-width:4}

    .motion-gizmo{position:absolute;z-index:90;width:380px;height:380px;border:3px solid #ffd15d;box-shadow:0 0 0 1px #000,0 0 18px #ffc84b66;pointer-events:none;touch-action:none;transform-origin:50% 50%}
    .motion-gizmo[hidden]{display:none}
    .motion-gizmo .gizmo-move{position:absolute;z-index:1;inset:20px;pointer-events:auto;cursor:move;touch-action:none}
    .motion-gizmo .gizmo-handle{position:absolute;z-index:4;width:26px;height:26px;border:3px solid #fff;background:#dfaa32;box-shadow:0 2px 8px #000b;pointer-events:auto;touch-action:none}
    .motion-gizmo .gizmo-scale{right:-14px;bottom:-14px;cursor:nwse-resize}
    .motion-gizmo .gizmo-scale-x{right:-14px;top:25%;cursor:ew-resize}.motion-gizmo .gizmo-scale-y{left:25%;bottom:-14px;cursor:ns-resize}
    .motion-gizmo .gizmo-skew-x{right:-14px;top:62%;border-radius:50%;background:#62d4ff;cursor:ew-resize}.motion-gizmo .gizmo-skew-y{left:62%;bottom:-14px;border-radius:50%;background:#62d4ff;cursor:ns-resize}
    .motion-gizmo .gizmo-rotate{left:50%;top:-58px;transform:translateX(-50%);border-radius:50%;background:#ff758d;cursor:grab}
    .motion-gizmo .gizmo-origin{z-index:6;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#ffbd42;cursor:crosshair}
    #state-marker{position:absolute;z-index:35;top:24px;left:50%;transform:translateX(-50%);font-size:52px;pointer-events:none}
    #state-marker:empty{display:none}

  <script>
    const slotColors=['#ff6b6b','#58c8ff','#ffd65a','#c98cff'];
    const previewWeaponSpecs=[
      {id:'great_sword',filename:'great_sword.svg',name:'대검'},
      {id:'lance',filename:'lance.svg',name:'랜스'},
      {id:'hunting_horn',filename:'hunting_horn.svg',name:'수렵피리'},
      {id:'bow',filename:'bow.svg',name:'활'}
    ];
    const hunters=previewWeaponSpecs.map((weapon,index)=>({
      ...weapon,index,status:'alive',hunterName:`헌터 ${index+1}`,hunterColor:slotColors[index],
      type:index===1?'shield':(index===3?'ranged':'melee'),personality:'normal',isNpc:false,
      hp:1000,maxHp:1000,atb:0,potions:10,shockTraps:1,lifepowders:1,flashPods:1,bombs:1,
      sharpness:100,maxSharpness:100,perks:[],elementalBlights:{},weaponInstance:null
    }));
    const released=(globalThis.HUNT_RELEASED_MONSTER_DATA||[]).filter(monster=>
      monster.selectable!==false&&(globalThis.HUNT_MONSTER_PATTERN_OVERRIDES?.[monster.id]||[]).length);
    const stateSpecs=[
      ['normal','일반',''],['enraged','분노','😡'],['exhausted','탈진','🤤'],['airborne','비행','🪽'],
      ['knockdown','대경직','💥'],['stunned','기절','💫'],['paralyzed','마비','⚡'],['sleeping','수면','💤']
    ];
    const previewContainer=document.getElementById('preview-overlay');
    const previewRenderer=new HuntRenderer({
      lobbyTimers:new ManagedTimers(),animationTimers:new ManagedTimers()
    });
    previewRenderer.setContainer(previewContainer);
    previewRenderer.selectedWeapons=hunters;
    previewRenderer.monsterState='normal';
    previewRenderer.monsterFlightState='grounded';
    const owner=previewRenderer;
    // 부위 파괴 반응은 실수렵과 같은 코드(HuntCombatAnimator)로 재생한다.
    // 랩에서 따로 구현하면 검수 화면과 실제 화면이 갈라진다.
    // 공격 애니메이터는 새로 만들지 않고 전투 애니메이터가 들고 있는 것을 쓴다 —
    // 두 개를 두면 서로의 정리(clearMonsterAnimations)를 지워 모션이 끊긴다.
    const combat=previewRenderer.combatAnimator;
    const animator=combat.monsterAttackAnimator;
    const monsterSelect=document.getElementById('monster-select');
    const patternButtons=document.getElementById('pattern-buttons');
    const stateButtons=document.getElementById('state-buttons');
    const targetButtons=document.getElementById('target-buttons');
    let targetMode='auto';
    let previewScenario=null;
    let currentState='normal';
    let activePatternId='';
    let labAudio=null;
    let pendingFlightTransitionTimer=null;
    let pendingReactionTimer=null;
    let pendingReactionBeatTimers=[];
    let previewRuntimePattern=null;
    let previewRuntimeSelection=null;
    let previewActionSession=null;
    const candidateMonsterId=String(new URLSearchParams(location.search).get('candidate')||'').trim();
    const candidateActions=monsterId=>candidateMonsterId===monsterId
      ?HuntMonsterCandidateCatalog.forMonster(monsterId):[];
    const patternsForMonster=monsterId=>{
      const candidates=candidateActions(monsterId);
      return candidates.length?candidates:(HUNT_MONSTER_PATTERN_OVERRIDES[monsterId]||[]);
    };

    function stopPreviewRuntime(reason='preview-reset'){
      // Preview is an editor surface: only the shared monster BEAT animator
      // owns the visible motion. Never leave a combat-runtime session alive
      // to process hunter damage/reactions behind the editor preview.
      animator.cancelBeatMotionPreview?.();
      animator.cancelPreviewProjectiles?.(reason);
      previewActionSession?.stop?.(reason);
      previewActionSession=null;
      animator.clearPreviewJudgmentMarkers?.();
      previewRuntimePattern=null;
      previewRuntimeSelection=null;
    }

    function playPreviewMotionOnly(pattern, selection){
      stopPreviewRuntime('preview-motion-replaced');
      const monsterImg=document.getElementById('fight-monster-img');
      if(!monsterImg)return false;
      const cards=[...document.querySelectorAll('.game-hunt-weapon-card')];
      const targetCard=cards[selection.primary]||null;
      // Keep target geometry for the authored route, but remove all target
      // resolution/impact presentation. The editor must show the monster
      // moving; hunter cards, damage, reactions and target dust belong only to
      // the live hunt session.
      const targets=[];
      const motionPattern={
        ...pattern,
        runtimePreviewMotionOnly:true,
        runtimeResolvedImpactTimeline:Array.isArray(pattern.runtimeResolvedImpactTimeline)
          ? pattern.runtimeResolvedImpactTimeline.map(event=>({ ...event })) : [],
        impactFx:null,
        motion:Array.isArray(pattern.motion)
          ? pattern.motion.map(beat=>{
            const clean={...beat};
            if(['target-impact-dust','part-swing-arc'].includes(clean.fx)) delete clean.fx;
            if(['target-impact-dust','part-swing-arc'].includes(clean.fxSecondary)) delete clean.fxSecondary;
            if(Array.isArray(clean.fxAdditional))
              clean.fxAdditional=clean.fxAdditional.filter(cue=>!['target-impact-dust','part-swing-arc'].includes(cue?.fx));
            if(Array.isArray(clean.cues))
              clean.cues=clean.cues.filter(cue=>!['target-impact-dust','part-swing-arc'].includes(cue?.fx));
            return clean;
          })
          : pattern.motion
      };
      document.documentElement.dataset.previewExecution='monster-beat-only';
      document.documentElement.dataset.previewHunterResolution='disabled';
      previewRuntimePattern=motionPattern;
      previewRuntimeSelection={primary:selection.primary,indices:[...selection.indices]};
      const accepted=animator.playBeatMotion(
        monsterImg,motionPattern,motionPattern.id,targetCard,targets);
      // Motion-only Preview has no HuntEngine damage loop, but it still feeds
      // the exact compiled BEAT events into the same projectile presenter as
      // live combat. No renderer-owned launch delay is permitted.
      const graph=motionPattern.beatV2;
      if(!motionPattern.runtimePreviewScrub&&graph?.backend==='beat-v2'){
        const resolveTarget=target=>{
          const primary=Number(selection.primary||0);
          if(target==='left')return primary-1;
          if(target==='right')return primary+1;
          return primary;
        };
        const judgments=(graph.events||[])
          .filter(event=>['damage','judgment','roar','tremor','wind'].includes(event.kind))
          .map(event=>({...event,targetIndices:[resolveTarget(event.target)]}));
        const timing=HuntProjectileTimingResolver.resolveSession(graph,{
          pattern:motionPattern,targetIndex:Number(selection.primary||0),judgmentEvents:judgments,
          actionSessionId:`preview:${graph.id}:${Date.now()}`
        });
        previewActionSession=new HuntActionSession({
          action:timing.action,
          actorKey:'preview-monster',
          mode:'preview',
          presentationOnly:true,
          sessionId:timing.context.actionSessionId,
          callbacks:{
          onEvent:(state,event)=>{
            animator.observeMonsterBeatEvent?.(state,event);
            // The editor intentionally does not run hunter combat/reaction
            // logic, but projectile contact remains authored monster motion.
            // Resolve that visual outcome at the same BEAT event—never from a
            // second renderer timer or a guessed flight duration.
            if(event.kind==='damage'&&event.projectileId){
              const targetIndex=resolveTarget(event.target);
              animator.resolveElementalProjectileOutcome?.(motionPattern,
                {...event,sessionId:state.context.actionSessionId},
                [{index:targetIndex,result:'hit'}]);
            }
          },
          onComplete:state=>animator.completeMonsterBeatPresentation?.(state),
          onCancel:(state,why)=>animator.cancelMonsterBeatPresentation?.(state,why)
          }
        });
        const runtimeState=previewActionSession.start(timing.context);
        animator.beginMonsterBeatPresentation?.(previewActionSession.state || runtimeState);
      }
      document.documentElement.dataset.previewActionAccepted=String(accepted!==false);
      document.documentElement.dataset.previewBeatActive=String(Boolean(accepted));
      return accepted!==false;
    }

    function pausePreviewRuntime(){
      previewActionSession?.pause?.();
      const controller=animator.activeBeatMotionPreview;
      controller?.animations?.forEach(animation=>animation.pause());
    }

    function resumePreviewRuntime(){
      previewActionSession?.resume?.();
      const controller=animator.activeBeatMotionPreview;
      controller?.animations?.forEach(animation=>animation.play());
    }

    function seekPreviewRuntime(progress){
      if(!previewRuntimePattern||!previewRuntimeSelection)return;
      const totalTicks=Number(previewActionSession?.action?.totalTicks||0);
      if(previewActionSession&&totalTicks>0)
        previewActionSession.seek(Math.round(Math.max(0,Math.min(1,Number(progress||0)))*totalTicks));
      animator.seekBeatMotion(Math.max(0,Math.min(1,Number(progress||0))));
    }

    function installMotionGizmo(){
      const image=document.getElementById('fight-monster-img'),host=image?.parentElement;if(!image||!host)return;
      const gizmo=document.createElement('div');gizmo.className='motion-gizmo';gizmo.hidden=true;gizmo.innerHTML='<span class="gizmo-move" title="이동"></span><span class="gizmo-handle gizmo-scale" title="균등 크기"></span><span class="gizmo-handle gizmo-scale-x" title="가로 크기"></span><span class="gizmo-handle gizmo-scale-y" title="세로 크기"></span><span class="gizmo-handle gizmo-skew-x" title="가로 기울기"></span><span class="gizmo-handle gizmo-skew-y" title="세로 기울기"></span><span class="gizmo-handle gizmo-rotate" title="회전"></span><span class="gizmo-handle gizmo-origin" title="회전 중심축"></span>';host.appendChild(gizmo);
      const parseOrigin=value=>{const parts=String(value||'50% 50%').match(/(-?[\d.]+)%?\s+(-?[\d.]+)%?/);return parts?[Number(parts[1]),Number(parts[2])]:[50,50]};

      if(!pattern.runtimePreviewMuteAudio)labAudio?.playPattern(pattern,[]);
      pendingReactionTimer=setTimeout(()=>{
        pendingReactionTimer=null;
        if(kind!=='pitfall'&&kind!=='trap'&&kind!=='shocktrap')
          combat.triggerEnvironmentEffect?.('trap-release');
        applyState('normal',true);
      },durationMs);
      return {ok:true,durationMs,patternId:pattern.id};
    }
    function playPattern(patternId, previewPattern=null){
      clearPendingFlightTransition();
      const authored=authoredPattern(patternId);
      // The editor payload is the current projection of the same authored
      // graph, including unsaved draft values. It must override the iframe's
      // startup snapshot for candidates too; keeping the startup candidate
      // authoritative made every direction/reset edit appear to do nothing.
      // Preserve the native flag so this projection still bypasses every
      // legacy adapter and runs directly through the shared BEAT animator.
      const source=previewPattern?{...(authored||{}),...previewPattern,
        nativeBeatCandidate:Boolean(authored?.nativeBeatCandidate),
        motion:previewPattern.motion||authored?.motion,
        targeting:previewPattern.targeting||authored?.targeting}:authored;
      if(!source)return {ok:false,reason:'pattern-not-found',durationMs:0};
      let pattern={...source,tags:[...(source.tags||[])],targeting:source.targeting?{...source.targeting}:null};
      // Every graph, including a native candidate, goes through the same
      // BEAT projection before target resolution.  Native only means the
      // source has no legacy CSS adapter; it must not skip the compiler that
      // derives one resolved judgment timeline for Preview and live hunts.
      pattern=HuntMonsterPatternCatalog.synchronizeEditedPattern(pattern);
      const reactionPlayback=playRuntimeReaction(pattern);
      if(reactionPlayback)return reactionPlayback;
      const required=pattern.requiredState||(pattern.tags.includes('flight-only')?'airborne':null);
      if(required)applyState(required,true);else applyState(currentState,true);
      const selection=resolvePreviewTargets(pattern);
      if(!selection.targets.length){
        const fallback=Number.isInteger(selection.primary)?selection.primary:0;
        // Movement still needs an anchor when an authored judgment deliberately
        // has no recipients.  Keep that anchor presentation-only: never turn an
        // empty judgment set into a fake Preview hit.
        selection.primary=fallback;selection.indices=[];selection.targets=[{index:fallback,result:'effect'}];
      }
      updateTargetSelection(selection.indices,selection.primary);
      activePatternId=pattern.id;
      patternButtons.querySelectorAll('.pattern-btn').forEach(button=>{
        const running=button.dataset.pattern===pattern.id;button.classList.toggle('is-running',running);
        if(running)button.style.setProperty('--target',slotColors[selection.primary]);
      });
      document.documentElement.style.setProperty('--target',slotColors[selection.primary]);
      const displayedTargets=[...selection.indices].sort((left,right)=>left-right);
      document.getElementById('run-readout').textContent=`${pattern.name} · ${targetMode==='auto'?'자동 ':''}${displayedTargets.map(index=>index+1).join('·')}번`;
      // Preview is an editor, not a second combat simulation. The same
      // authored BEAT graph used by live hunts is played directly by the
      // shared monster animator. Hunter damage/reaction resolution stays in
      // the real hunt only; the editor shows its judgments on the timeline.
      playPreviewMotionOnly(pattern,selection);
      if(pattern.runtimePreviewScrub)
        animator.seekBeatMotion(Math.max(0,Math.min(1,Number(previewScenario?.scrubProgress||0))));
      if(pattern.flightTransition==='takeoff'){
        pendingFlightTransitionTimer=setTimeout(()=>{
          pendingFlightTransitionTimer=null;
          applyState('airborne',true);
        },Math.max(1,Number(pattern.animationDurationMs||1800)));
      }else if(pattern.flightTransition==='land'){
        pendingFlightTransitionTimer=setTimeout(()=>{
          pendingFlightTransitionTimer=null;
          applyState('normal',true);
        },Math.max(1,Number(pattern.animationDurationMs||1800)));
      }
      return {ok:true,durationMs:Math.max(100,Number(pattern.animationDurationMs
        ||pattern.movement?.ticks*100||1800)),patternId:pattern.id};
    }
    function resetPatternPreviewPose(){
      stopPreviewRuntime('pattern-selection');
      clearPendingFlightTransition();
      clearPendingReaction();
      combat.clearMonsterAnimations('pattern-selection');
      const image=document.getElementById('fight-monster-img');
      const gizmo=document.querySelector('.motion-gizmo');
      for(const element of [image,gizmo]){
        if(!element?.style)continue;
        for(const property of ['translate','rotate','scale','transform','transform-origin'])
          element.style.removeProperty(property);
      }
      activePatternId='';
    }
    function showMonster(id, previewMonster=null){
      labAudio?.cancelPatternAudio();
      const monster=released.find(entry=>entry.id===id)||previewMonster||released[0];
      owner.selectedMonster={...monster};
      previewRenderer.renderFight({
        hpLabelText:monster.nameKO,
        selectedMonster:owner.selectedMonster,
        selectedWeapons:hunters,
        showMonsterHp:true,
        timeLimit:480,
        smallMonsterCount:0,
        cartLimit:3,
        sharedSupply:null
      });
      const stage=document.querySelector('.hunt-monster-motion-stage');
      if(stage&&!document.getElementById('state-marker')){
        const marker=document.createElement('div');marker.id='state-marker';stage.appendChild(marker);
      }
      installMotionGizmo();
      const image=document.getElementById('fight-monster-img');
      const combatName=document.getElementById('monster-name-text');
      if(combatName)combatName.textContent=monster.nameKO;
      const patterns=patternsForMonster(monster.id);
      document.getElementById('monster-summary').innerHTML=`<strong>${monster.nameKO}</strong>${monster.species||'분류 미상'} · 패턴 ${patterns.length}개`;
      patternButtons.replaceChildren(...patterns.map(pattern=>{
        const button=document.createElement('button');button.className='pattern-btn';button.dataset.pattern=pattern.id;
        button.dataset.requiredState=pattern.requiredState||'';button.dataset.flight=String(pattern.tags?.includes('flight-only')||false);
        button.textContent=pattern.name;button.title=`${pattern.id} · ${pattern.type}`;return button;
      }));
      resetParts();
      activePatternId='';applyState('normal',true);updateTargetSelection([]);
      document.getElementById('run-readout').textContent='패턴을 선택하세요';
    }
    function initialize(){
      const embedded=new URLSearchParams(location.search).get('embed')==='1';
      document.documentElement.classList.toggle('embedded-preview',embedded);
      labAudio=new HuntMonsterPatternLabAudio({monsterProvider:()=>owner.selectedMonster});
      owner.onMonsterProjectileLaunchAudio=(monster,pattern)=>labAudio?.playProjectileLaunch(monster,pattern);
      labAudio.installToggle(document.querySelector('.target-panel'));
      monsterSelect.replaceChildren(...released.map(monster=>{
        const option=document.createElement('option');option.value=monster.id;option.textContent=monster.nameKO;return option;
      }));
      renderStateButtons();renderTargetButtons();
      const requested=new URLSearchParams(location.search).get('monster');
      monsterSelect.value=released.some(monster=>monster.id===requested)?requested:(released.find(monster=>monster.id==='tigrex')?.id||released[0]?.id);
      showMonster(monsterSelect.value);
    }
    monsterSelect.addEventListener('change',event=>showMonster(event.target.value));
    patternButtons.addEventListener('click',event=>{const button=event.target.closest('.pattern-btn');if(button)playPattern(button.dataset.pattern)});
    stateButtons.addEventListener('click',event=>{const button=event.target.closest('.state-btn');if(button)applyState(button.dataset.state)});
    // 부위 패널은 renderCombatChrome이 나중에 주입한다. #lab-parts에 직접 걸면
    // 이 줄이 도는 시점에는 아직 없어서 ?.가 조용히 넘어가고, 눌러도 아무 일이
    // 일어나지 않는다. 항상 있는 조상에 위임한다.
    document.addEventListener('click',event=>{
      const slot=event.target.closest?.('.hunt-monster-part');
      if(slot)togglePart(slot.dataset.partKind);
    });
    targetButtons.addEventListener('click',event=>{const button=event.target.closest('.target-btn');if(!button)return;targetMode=button.dataset.target;updateTargetSelection([],null);if(activePatternId)playPattern(activePatternId)});
    const ANATOMY_LABELS={head:'머리',mouth:'입',torso:'몸통',tail:'꼬리','left-wing':'좌익','right-wing':'우익',
      'left-front-leg':'좌앞발','right-front-leg':'우앞발','left-foreleg':'좌앞발','right-foreleg':'우앞발',foot:'앞발'};
    let anatomyGuideEnabled=true,anatomyGuideFrame=0,anatomyDraft=null;
    const cloneGeometry=value=>value?JSON.parse(JSON.stringify(value)):null;
    function syncAnatomyTransform(){
      cancelAnimationFrame(anatomyGuideFrame);
      const svg=document.querySelector('.monster-anatomy-guide'),image=document.getElementById('fight-monster-img');
      if(!anatomyGuideEnabled||!svg||!image)return;
      const style=getComputedStyle(image);
      Object.assign(svg.style,{left:`${image.offsetLeft}px`,top:`${image.offsetTop}px`,width:`${image.offsetWidth}px`,height:`${image.offsetHeight}px`,transform:style.transform,transformOrigin:style.transformOrigin,translate:style.translate,rotate:style.rotate,scale:style.scale,opacity:style.opacity});
      anatomyGuideFrame=requestAnimationFrame(syncAnatomyTransform);
    }
    function installAnatomyDrag(group,kind,part,svg){
      group.onpointerdown=event=>{
        event.preventDefault();event.stopPropagation();group.setPointerCapture(event.pointerId);group.classList.add('is-dragging');
        const startX=event.clientX,startY=event.clientY,base=cloneGeometry(part),rect=svg.getBoundingClientRect();
        const move=next=>{const dx=(next.clientX-startX)/Math.max(1,rect.width),dy=(next.clientY-startY)/Math.max(1,rect.height),clamp=value=>Math.max(0,Math.min(1,value));if(Array.isArray(base.path))part.path=base.path.map(point=>({x:clamp(point.x+dx),y:clamp(point.y+dy)}));else{part.x=clamp(base.x+dx);part.y=clamp(base.y+dy)}group.setAttribute('transform',`translate(${dx*512} ${dy*512})`)};
        const finish=()=>{group.onpointermove=null;group.onpointerup=null;group.onpointercancel=null;group.classList.remove('is-dragging');renderAnatomyGuide();parent.postMessage({type:'bubblechat:monster-anatomy-edit',monsterId:owner.selectedMonster?.id||'',geometry:anatomyDraft},'*')};
        group.onpointermove=move;group.onpointerup=finish;group.onpointercancel=finish;
      };
    }
    function renderAnatomyGuide(){
      cancelAnimationFrame(anatomyGuideFrame);document.querySelector('.monster-anatomy-guide')?.remove();
      if(!anatomyGuideEnabled)return;
      const image=document.getElementById('fight-monster-img'),facingLayer=image?.closest('.hunt-monster-facing-layer');
      const source=HuntMonsterAnatomyCatalog.visualGeometry(owner.selectedMonster);
      if(!image||!facingLayer||!source)return;
      if(!anatomyDraft||anatomyDraft.monsterId!==(owner.selectedMonster?.id||''))anatomyDraft={...cloneGeometry(source),monsterId:owner.selectedMonster?.id||''};
      const geometry=anatomyDraft,svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.classList.add('monster-anatomy-guide');svg.setAttribute('viewBox','0 0 512 512');
      svg.innerHTML='<defs><marker id="part-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5de1ff"/></marker></defs>';
      const torso=geometry.parts.torso||{x:.5,y:.5},pointOf=point=>({x:point.x*512,y:point.y*512});
      for(const [kind,part] of Object.entries(geometry.parts||{})){
        const group=document.createElementNS(svg.namespaceURI,'g');group.setAttribute('class','part-handle');group.dataset.partKind=kind;
        const rawPoints=Array.isArray(part.path)&&part.path.length?part.path:[part],points=rawPoints.map(pointOf),point=points[points.length-1],center=pointOf(torso);
        if(points.length>1){const path=document.createElementNS(svg.namespaceURI,'polyline');path.setAttribute('class','part-path');path.setAttribute('points',points.map(item=>`${item.x},${item.y}`).join(' '));group.appendChild(path);const hit=path.cloneNode();hit.setAttribute('class','part-hit');group.appendChild(hit)}
        let dx=point.x-center.x,dy=point.y-center.y,length=Math.hypot(dx,dy)||1;if(kind==='head'&&geometry.baseFacing!=='front'){dx=geometry.baseFacing==='left'?-1:1;dy=0;length=1}
        const line=document.createElementNS(svg.namespaceURI,'line');line.setAttribute('class','part-line');line.setAttribute('x1',point.x);line.setAttribute('y1',point.y);line.setAttribute('x2',point.x+dx/length*48);line.setAttribute('y2',point.y+dy/length*48);line.setAttribute('marker-end','url(#part-arrow)');group.appendChild(line);
        const dot=document.createElementNS(svg.namespaceURI,'circle');dot.setAttribute('class','part-dot');dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);dot.setAttribute('r','10');group.appendChild(dot);
        const label=document.createElementNS(svg.namespaceURI,'text');label.setAttribute('class','part-label');label.setAttribute('x',point.x+12);label.setAttribute('y',point.y-13);label.textContent=ANATOMY_LABELS[kind]||kind;group.appendChild(label);
        installAnatomyDrag(group,kind,part,svg);svg.appendChild(group);
      }
      facingLayer.appendChild(svg);syncAnatomyTransform();
    }
    addEventListener('message',event=>{
      if(event.source!==parent||!/^http:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?$/.test(event.origin))return;
      const message=event.data||{};
      if(message.type==='bubblechat:pattern-anatomy'){
        anatomyGuideEnabled=Boolean(message.enabled);renderAnatomyGuide();return;
      }
      if(message.type==='bubblechat:pattern-preview-settings'){
        previewScenario=message.scenario||previewScenario;
        if(message.target!=null)targetMode=String(message.target);
        updateTargetSelection(previewScenario?.forcedTargetIndices||[],previewScenario?.primaryTargetIndex??null);
        if(message.state&&message.state!==currentState)applyState(message.state,true);
        owner.refreshMotionGizmo?.();
        return;
      }
      if(message.type!=='bubblechat:pattern-preview'||!message.monsterId||!message.pattern?.id)return;
      previewScenario=message.scenario||null;
      if(message.resetPreviewPose)resetPatternPreviewPose();
      if(owner.selectedMonster?.id!==message.monsterId){monsterSelect.value=message.monsterId;showMonster(message.monsterId,message.monster)}
      if(message.target!=null){targetMode=String(message.target);updateTargetSelection([],null)}
      if(message.state)applyState(message.state,true);
      if(message.resetOnly){
        requestAnimationFrame(()=>owner.refreshMotionGizmo?.());
        if(anatomyGuideEnabled)requestAnimationFrame(renderAnatomyGuide);
        return;
      }
      let playback;
      try{
        playback=playPattern(message.pattern.id,message.pattern);
      }catch(error){
        playback={ok:false,reason:error?.message||String(error),durationMs:0};
        console.error('[pattern-preview] playback failed',message.pattern.id,error);
      }
      if(message.playbackToken){
        document.documentElement.dataset.previewPlaybackToken=String(message.playbackToken);
        parent.postMessage({type:'bubblechat:pattern-preview-playback',
          playbackToken:message.playbackToken,...playback},event.origin);
      }
      requestAnimationFrame(()=>owner.refreshMotionGizmo?.());
      if(anatomyGuideEnabled)requestAnimationFrame(renderAnatomyGuide);
    });
    addEventListener('message',event=>{
      if(event.source!==parent||!/^http:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?$/.test(event.origin))return;
      const message=event.data||{};
      if(message.type==='bubblechat:pattern-preview-seek')seekPreviewRuntime(message.progress);
      if(message.type==='bubblechat:pattern-preview-transport'){
        if(message.action==='pause')pausePreviewRuntime();
        if(message.action==='resume')resumePreviewRuntime();
        if(message.action==='stop')resetPatternPreviewPose();
      }
    });
    if(parent!==window){
      let reviewOrigin='http://127.0.0.1:17930';
      try{
        const referrerOrigin=new URL(document.referrer).origin;
        if(/^http:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?$/.test(referrerOrigin))reviewOrigin=referrerOrigin;
      }catch(_){/* direct fixture fallback */}
      parent.postMessage({type:'bubblechat:pattern-preview-ready'},reviewOrigin);
    }
    addEventListener('load',initialize);
  </script>
