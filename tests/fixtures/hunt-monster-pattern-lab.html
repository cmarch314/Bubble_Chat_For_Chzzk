<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,initial-scale=1">
  <title>몬스터 패턴 유닛 테스트</title>
  <link rel="stylesheet" href="../../style.css">
  <!-- 질의 문자열 없이 그대로 받는다. 프리뷰 서버가 Cache-Control: no-store를
       보내므로 매번 새로 읽는다. 예전에는 ?v=20260803f 같은 손관리 토큰이 박혀
       있어서, 토큰을 올리지 않으면 브라우저가 옛 CSS를 계속 썼다.
       document.write로 토큰을 붙여봤지만 그 역시 확인이 어려운 경로였다.
       지금 무엇이 로드됐는지는 우측 상단 CSS 빌드 표시로 눈으로 확인한다. -->
  <link rel="stylesheet" href="../../styles/hunt-runtime.css">
  <style>
    :root{--panel:#10150feF;--line:#81704d;--gold:#f2d38b;--mint:#78e0c0;--target:#fff}
    *{box-sizing:border-box}
    html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:radial-gradient(circle at 52% 18%,#344032,#090c09 72%);color:#fff;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
    button,select{font:800 16px/1.1 inherit;color:#fff;background:#1e261d;border:2px solid #62583d;border-radius:8px;cursor:pointer}
    button:hover,select:hover{border-color:#ead18c;background:#293426}
    #lab{position:relative;width:1920px;height:918px;overflow:hidden}
    .lab-controls{position:absolute;z-index:100;top:18px;left:24px;right:24px;min-height:190px;display:grid;grid-template-columns:272px 1fr;gap:14px;padding:14px;border:3px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#151b14f5,#090c09ed);box-shadow:0 15px 35px #000a}
    .monster-picker{display:flex;flex-direction:column;gap:9px;padding-right:13px;border-right:2px solid #756440}
    .monster-picker label{font:1000 22px/1 sans-serif;color:var(--gold)}
    #monster-select{width:100%;height:46px;padding:0 10px}
    #monster-summary{min-height:76px;padding:10px;border-radius:9px;background:#0007;color:#cbd8c8;font:700 15px/1.45 sans-serif}
    #monster-summary strong{display:block;color:#fff;font-size:22px;margin-bottom:5px}
    .command-deck{min-width:0;display:grid;grid-template-rows:auto auto;gap:10px}
    .action-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
    .pattern-panel,.state-panel,.target-panel{min-width:0}
    .panel-label{display:block;margin:0 0 6px;color:#b8c7b4;font:900 14px/1 sans-serif;letter-spacing:.04em}
    #pattern-buttons{display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;max-height:106px;overflow-y:auto;padding:1px 5px 4px 1px}
    .pattern-btn{min-height:38px;padding:7px 11px;white-space:nowrap}
    .pattern-btn[data-required-state="enraged"]::after{content:" 😡"}
    .pattern-btn[data-flight="true"]::after{content:" 🪽"}
    .pattern-btn.is-running{border-color:var(--target);box-shadow:0 0 0 2px #000,0 0 16px var(--target);background:#39442b}
    #state-buttons{display:grid;grid-template-columns:repeat(4,72px);gap:6px}
    .state-btn{height:38px;padding:4px 6px}
    .state-btn.is-active{border-color:#ffe69d;box-shadow:0 0 13px #ffc85c99;background:#54421f}
    .target-panel{display:flex;align-items:center;gap:8px;padding-top:9px;border-top:1px solid #665a3d}
    .target-panel .panel-label{width:72px;margin:0;color:var(--mint)}
    #target-buttons{display:flex;gap:8px}
    .target-btn{min-width:84px;height:38px;padding:5px 12px}
    .target-btn.is-selected{border-color:var(--target-color,#fff);box-shadow:0 0 0 2px #000,0 0 15px var(--target-color,#fff);background:#344032}
    #run-readout{margin-left:auto;max-width:550px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffe4a6;font:900 17px/1 sans-serif;text-align:right}
    #monster-showcase-panel{position:absolute;z-index:12;top:222px;left:0;right:0;height:468px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-motion-stage{position:relative;width:1020px;height:450px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-attack-motion{position:relative;width:390px;height:390px;display:grid;place-items:center;overflow:visible}
    .hunt-monster-facing-layer{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:visible}
    #fight-monster-img{width:390px;height:390px;object-fit:contain;filter:drop-shadow(0 28px 24px #000c)}
    #state-marker{position:absolute;z-index:35;top:24px;left:50%;transform:translateX(-50%);font-size:52px;filter:drop-shadow(0 4px 6px #000);pointer-events:none}
    #state-marker:empty{display:none}
    .lab-exhausted{animation:lab-exhausted 1.1s ease-in-out infinite!important;filter:grayscale(.28) brightness(.82) drop-shadow(0 24px 20px #000b)!important}
    @keyframes lab-exhausted{0%,100%{transform:translateY(18px) rotate(-3deg) scaleY(.94)}50%{transform:translateY(25px) rotate(3deg) scaleY(.88)}}
    .game-hunt-weapons-grid{position:absolute;z-index:8;left:34px;right:34px;bottom:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .game-hunt-weapon-card{--slot-color:#fff;position:relative;height:190px;border:4px solid #675b40;border-radius:13px;background:#111e;padding:8px;display:grid;place-items:center;overflow:visible;transition:border-color .12s,box-shadow .12s,transform .12s}
    .game-hunt-weapon-card.is-targeted{border-color:var(--slot-color);box-shadow:0 0 0 2px #000,0 0 22px var(--slot-color);transform:translateY(-5px)}
    .game-hunt-weapon-img-container{position:relative;width:108px;height:108px}
    .game-hunt-weapon-img{width:108px;height:108px;object-fit:contain}
    .hunter-name{font:1000 19px/1 sans-serif;color:#fff}
    .hunter-slot{position:absolute;top:8px;left:10px;font:1000 20px/1 sans-serif;color:var(--slot-color)}
    .chat-safe{height:162px;border-top:2px dashed #31d3aa88;background:#020604e8;display:grid;place-items:center;color:#78d8ba;font:900 21px/1 sans-serif}
  </style>
  <style>
    /* Match the production 1920x1080 combat geometry. The test console is a
       separate glass layer, so opening it never pushes monster/hunter bounds. */
    html,body{background:transparent}
    #lab{position:relative;width:1760px!important;height:918px;margin:0 auto;padding:18px 34px 14px!important;overflow:hidden}
    .lab-controls{position:fixed;z-index:2147483647;top:12px;left:50%;right:auto;width:min(1540px,calc(100vw - 48px));min-height:124px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;padding:10px 12px;border:2px solid #a68a55;border-radius:13px;background:linear-gradient(145deg,rgba(16,22,15,.72),rgba(5,8,6,.62));box-shadow:0 12px 28px #0008;backdrop-filter:blur(6px);transform:translateX(-50%);opacity:.76;transition:opacity .15s ease,background .15s ease}

    #monster-select{height:36px;padding:0 9px}
    #monster-summary{min-height:40px;padding:6px 8px;font-size:12px;line-height:1.25}
    #monster-summary strong{display:inline;font-size:15px;margin-right:7px}
    .command-deck{gap:7px}
    .action-row{gap:10px}
    .panel-label{margin-bottom:4px;font-size:12px}
    #pattern-buttons{flex-wrap:nowrap;max-height:none;overflow-x:auto;overflow-y:hidden;gap:5px;padding:0 2px 4px}
    .pattern-btn{min-height:31px;padding:5px 9px}

    #state-buttons{grid-template-columns:repeat(4,66px);gap:4px}

    #run-readout{max-width:460px;font-size:15px}
    #css-build{margin-left:10px;padding:2px 8px;border-radius:6px;background:#0008;color:#8fe0b8;font:800 12px/1.6 ui-monospace,monospace;white-space:nowrap}
    #css-build.is-missing{background:#5a0d0d;color:#ffb4b4}

    .lab-vitals{position:relative;z-index:5}
    .lab-vitals .hunt-monster-atb-track>i{width:72%}
    .lab-aux{top:112px!important;left:34px!important;right:34px!important}
    .lab-parts{display:flex;gap:8px;padding:7px 10px;min-height:82px}
    .lab-part{display:grid;grid-template-rows:48px 20px;place-items:center;width:58px;color:#fff;font-weight:900}
    .lab-part>span{font-size:38px;filter:drop-shadow(0 3px 5px #000)}
    .lab-part>b{width:100%;border:1px solid #b79555;border-radius:5px;background:#050504e8;color:#fff4d2;font-size:13px;line-height:19px;text-align:center}
    #monster-showcase-panel{position:absolute!important;z-index:20!important;top:132px;left:34px;right:34px;width:auto!important;height:430px;min-height:0!important;margin:0!important;padding:0!important;display:grid!important;place-items:center;overflow:visible;background:transparent!important;border:0!important;box-shadow:none!important}
    .hunt-monster-motion-stage{width:min(1320px,82vw)!important;height:410px!important}
    .hunt-monster-attack-motion{width:380px;height:380px}
    #fight-monster-img{width:380px;height:380px}
    #lab .game-hunt-weapons-grid{position:absolute;z-index:8;left:34px;right:34px;bottom:16px;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    #lab .game-hunt-weapon-card{--slot-color:#fff;position:relative;height:326px;border:3px solid #675b40;border-radius:13px;background:rgba(20,16,12,.9);padding:13px 14px 11px!important;overflow:visible;transition:border-color .12s,box-shadow .12s,transform .12s}
    #lab .game-hunt-weapon-card.is-targeted{border-color:var(--slot-color)!important;box-shadow:0 0 0 2px #000,0 0 22px var(--slot-color);transform:translateY(-5px)}
    #lab .game-hunt-weapon-img-container{width:144px!important;height:144px!important}
    #lab .game-hunt-weapon-img{width:138px;height:138px;object-fit:contain}
    .hunter-slot{left:auto;right:10px;top:10px;font-size:16px;z-index:20}
    .lab-sharpness{grid-area:sharp;height:9px;border:1px solid #9a8350;border-radius:4px;background:linear-gradient(90deg,#ff4747 0 16%,#ff9f2f 16% 32%,#ffe84c 32% 49%,#66c96d 49% 68%,#5d9cff 68% 83%,#f6f2e9 83%);box-shadow:inset 0 0 3px #000}
    .lab-special{grid-area:special;text-align:right;font-size:20px}
    .lab-perks{grid-area:perks;display:flex;flex-direction:column;gap:5px;align-self:center}
    .lab-perk{padding:5px 7px;border:2px solid #8a7042;border-radius:8px;background:#17130ee6;color:#ffe1a3;font:900 12px/1.05 sans-serif;white-space:nowrap}
    .lab-probabilities{grid-area:probabilities;display:flex;justify-content:center;gap:4px;padding-top:5px;border-top:1px solid #c5a05933}
    .lab-audio-toggle{min-width:98px;height:31px;padding:4px 9px;border-color:#78bda8;background:#102b25e8;color:#c9ffec;white-space:nowrap}
    .lab-audio-toggle[data-audio-status="playing"]{border-color:#9effcf;box-shadow:0 0 12px #46e9a577}
    .lab-audio-toggle[aria-pressed="false"]{border-color:#806b59;background:#251d18e8;color:#c6b7a9;box-shadow:none}
  </style>
</head>
<body>
  <main id="lab" class="game-hunt-card hunt-combat-board">
    <header class="lab-controls">
      <section class="monster-picker">
        <label for="monster-select">몬스터 선택</label>
        <select id="monster-select"></select>
        <div id="monster-summary"></div>
      </section>
      <section class="command-deck">
        <div class="action-row">
          <div class="pattern-panel"><span class="panel-label">패턴 실행</span><div id="pattern-buttons"></div></div>
          <div class="state-panel"><span class="panel-label">상태 실행</span><div id="state-buttons"></div></div>
        </div>
        <div class="target-panel">
          <span class="panel-label">타겟</span>
          <div id="target-buttons"></div>
          <div id="run-readout">패턴을 선택하세요</div>
          <!-- 로드된 CSS 빌드. 비어 있으면 hunt-runtime.css가 아예 안 온 것이다. -->
          <div id="css-build" title="로드된 hunt-runtime.css 빌드"></div>
        </div>
      </section>
    </header>
    <section id="monster-showcase-panel" class="game-hunt-monster-showcase">
      <div class="hunt-monster-motion-stage">
        <!-- 레이어 순서는 실수렵(HuntRenderer)과 같아야 한다. 다르면 검수 화면과
             실제 화면이 갈라지고, 여기서 고친 것이 저기서 안 보인다.
             tests/hunt-monster-layer-contract.test.js가 둘을 대조한다. -->
        <div class="hunt-monster-attack-motion">
          <div class="hunt-monster-pose-layer">
            <div class="hunt-monster-aim-layer"><div class="hunt-monster-facing-layer">

              <div class="hunt-monster-eye-glow" aria-hidden="true"></div>
            </div></div>
          </div>
        </div>
        <div id="state-marker"></div>
      </div>
    </section>
    <section class="game-hunt-weapons-grid">
      <article id="fight-card-0" class="game-hunt-weapon-card" style="--slot-color:#ff6b6b"><span class="hunter-slot">1</span><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/great_sword.svg" alt="대검"></div><div class="hunter-name">대검</div></article>
      <article id="fight-card-1" class="game-hunt-weapon-card" style="--slot-color:#58c8ff"><span class="hunter-slot">2</span><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/lance.svg" alt="랜스"></div><div class="hunter-name">랜스</div></article>
      <article id="fight-card-2" class="game-hunt-weapon-card" style="--slot-color:#ffd65a"><span class="hunter-slot">3</span><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/hunting_horn.svg" alt="수렵피리"></div><div class="hunter-name">수렵피리</div></article>
      <article id="fight-card-3" class="game-hunt-weapon-card" style="--slot-color:#c98cff"><span class="hunter-slot">4</span><div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/bow.svg" alt="활"></div><div class="hunter-name">활</div></article>
    </section>
  </main>
  <footer class="chat-safe">몬스터 패턴 유닛 테스트 · OBS 하단 15% 채팅 안전영역</footer>
  <script>queueMicrotask(()=>{const el=document.getElementById('css-build');if(!el)return;const v=getComputedStyle(document.documentElement).getPropertyValue('--hunt-css-build').trim().replace(/^"|"$/g,'');el.textContent=v?('CSS '+v):'CSS 미로드';el.classList.toggle('is-missing',!v)})</script>
  <script>window.addEventListener('error',event=>{const message=String(event.message||event.error||'unknown');document.documentElement.dataset.labRuntimeError=message;document.title=`LAB ERROR: ${message}`;queueMicrotask(()=>{const readout=document.getElementById('run-readout');if(readout)readout.textContent=`오류 · ${message}`})})</script>

  <!-- 애니메이터보다 먼저 로드해야 한다. 이 두 레지스트리가 없으면 몬스터별 CSS 변수
       (--tigrex-bite-*, --monster-glide-*, --narga-aim-deg 등)가 채워지지 않고,
       그 변수를 쓰는 키프레임은 calc()가 무효가 되어 transform 전체가 버려진다.
       결과적으로 해당 패턴이 제자리에 멈춰 있는 것처럼 보인다. -->
  <script src="../../js/effects/hunt/HuntStageAnchors.js"></script>

  <script src="../../js/effects/hunt/HuntMonsterFacingChoreography.js"></script>
  <script src="../../js/effects/hunt/HuntMonsterAttackAnimator.js"></script>
  <script>
    const slotColors=['#ff6b6b','#58c8ff','#ffd65a','#c98cff'];
    const hunters=Array.from({length:4},(_,index)=>({index,status:'alive'}));
    const released=(globalThis.HUNT_RELEASED_MONSTER_DATA||[]).filter(monster=>
      monster.selectable!==false&&(globalThis.HUNT_MONSTER_PATTERN_OVERRIDES?.[monster.id]||[]).length);
    const stateSpecs=[
      ['normal','일반',''],['enraged','분노','😡'],['exhausted','탈진','🤤'],['airborne','비행','🪽'],
      ['knockdown','대경직','💥'],['stunned','기절','💫'],['paralyzed','마비','⚡'],['sleeping','수면','💤']
    ];
    const owner={card:document.getElementById('lab'),selectedMonster:null,monsterState:'normal',monsterFlightState:'grounded',animationTimers:{timeout(fn,ms){return setTimeout(fn,ms)},clear(id){clearTimeout(id)}}};
    const animator=new HuntMonsterAttackAnimator(owner,()=>{});
    const monsterSelect=document.getElementById('monster-select');
    const patternButtons=document.getElementById('pattern-buttons');
    const stateButtons=document.getElementById('state-buttons');
    const targetButtons=document.getElementById('target-buttons');
    let targetMode='auto';
    let currentState='normal';
    let activePatternId='';
    let labAudio=null;
    let pendingFlightTransitionTimer=null;

    function clearPendingFlightTransition(){
      if(pendingFlightTransitionTimer!==null){
        clearTimeout(pendingFlightTransitionTimer);
        pendingFlightTransitionTimer=null;
      }
    }

    function clearStateClasses(){
      const image=document.getElementById('fight-monster-img');
      const stage=image.closest('.hunt-monster-motion-stage');
      image.classList.remove('enraged','lab-exhausted','monster-airborne','monster-knockdown-anim','stunned_monster','monster-paralyzed','monster-sleeping');
      stage.classList.remove('monster-flight-stage-airborne');
    }
    function applyState(state, fromPattern=false){
      if(!fromPattern)clearPendingFlightTransition();
      animator.clearMonsterAnimations?.('pattern-lab-state');
      clearStateClasses();
      currentState=state;
      owner.monsterState=state==='airborne'?'normal':state;
      owner.monsterFlightState=state==='airborne'?'airborne':'grounded';
      const image=document.getElementById('fight-monster-img');
      const stage=image.closest('.hunt-monster-motion-stage');
      const facing=image.closest('.hunt-monster-facing-layer');
      const marker=document.getElementById('state-marker');
      const spec=stateSpecs.find(entry=>entry[0]===state)||stateSpecs[0];
      marker.textContent=spec[2];
      if(state==='enraged'){
        image.classList.add('enraged');
      }else if(state==='exhausted')image.classList.add('lab-exhausted');
      else if(state==='airborne'){image.classList.add('monster-airborne');stage.classList.add('monster-flight-stage-airborne')}
      else if(state==='knockdown')image.classList.add('monster-knockdown-anim');
      else if(state==='stunned')image.classList.add('stunned_monster');
      else if(state==='paralyzed')image.classList.add('monster-paralyzed');
      else if(state==='sleeping')image.classList.add('monster-sleeping');
      stateButtons.querySelectorAll('.state-btn').forEach(button=>button.classList.toggle('is-active',button.dataset.state===state));
      if(!fromPattern)labAudio?.playState(state);
      if(!fromPattern)document.getElementById('run-readout').textContent=`상태 · ${spec[1]}`;
    }
    function renderStateButtons(){
      stateButtons.replaceChildren(...stateSpecs.map(([state,label,icon])=>{
        const button=document.createElement('button');
        button.className='state-btn';button.dataset.state=state;button.textContent=`${icon}${label}`;return button;
      }));
    }
    function renderTargetButtons(){
      const auto=document.createElement('button');
      auto.className='target-btn';auto.dataset.target='auto';auto.textContent='🎲 자동';
      const numbered=hunters.map(hunter=>{
        const button=document.createElement('button');
        button.className='target-btn';button.dataset.target=String(hunter.index);button.textContent=`${hunter.index+1}번`;
        button.style.setProperty('--target-color',slotColors[hunter.index]);return button;
      });
      targetButtons.replaceChildren(auto,...numbered);updateTargetSelection([]);
    }
    function updateTargetSelection(indices, primary=null){
      const selected=new Set(indices);
      document.querySelectorAll('.game-hunt-weapon-card').forEach((card,index)=>card.classList.toggle('is-targeted',selected.has(index)));
      targetButtons.querySelectorAll('.target-btn').forEach(button=>{
        const index=Number(button.dataset.target);
        const active=button.dataset.target==='auto'?targetMode==='auto':selected.has(index);
        button.classList.toggle('is-selected',active);
        if(button.dataset.target==='auto'){
          const linked=Number.isInteger(primary)?primary:null;
          button.textContent=linked===null?'🎲 자동':`🎲 자동→${linked+1}`;
          button.style.setProperty('--target-color',linked===null?'#fff':slotColors[linked]);
        }
      });
    }
    function laneFromPrimary(primary,count){
      const take=Math.max(1,Math.min(4,count));
      const start=Math.max(0,Math.min(4-take,primary-Math.floor((take-1)/2)));
      return hunters.slice(start,start+take);
    }
    function resolvePreviewTargets(pattern){
      const primary=targetMode==='auto'?Math.floor(Math.random()*hunters.length):Number(targetMode);
      const random=()=>Math.min(.999,(primary+.25)/hunters.length);
      const count=Math.max(1,Math.min(4,Number(pattern.maxTargets||pattern.minTargets||1)));
      // 프로덕션(HuntMonsterTurnExecutor)과 같은 순서로 패스 수를 정한다.
      // 예전에는 passCountByState만 보고 나머지는 2로 떨어뜨려, targeting.passCount가
      // 1인 패턴(평상시 꼬리 회전)이 랩에서만 2패스로 돌았다. 축·표적이 실제 전투와
      // 달라져 멀쩡한 패턴이 고장 난 것처럼 보였다.
      const passCount=Number(pattern.targeting?.passCountByState?.[owner.monsterState]
        ||pattern.targeting?.passCount
        ||pattern.impactTimelineByState?.[owner.monsterState]?.length
        ||pattern.impactTimeline?.length||2);
      const resolved=HuntMonsterActionPolicy.resolveTargeting({
        targetable:hunters,count,passCount,random,
        mode:pattern.targeting?.mode||'',defaultTargets:laneFromPrimary(primary,count),primaryIndex:primary
      });
      Object.assign(pattern,resolved.runtime);
      const sequence=pattern.runtimeImpactTargetSequence||[];
      const finalPrimary=sequence.flat().filter(Number.isInteger).at(-1)??primary;
      const timeline=HuntMonsterActionPolicy.impactTimeline(pattern,owner.monsterState).map((event,index)=>({
        ...event,
        targetIndices:Array.isArray(event.targetIndices)&&event.targetIndices.length?event.targetIndices
          :event.targetMode==='repeat-previous'?[finalPrimary]
            :Array.isArray(sequence[index])&&sequence[index].length?sequence[index]
              :resolved.targets.map(target=>target.index)
      }));
      pattern.runtimeResolvedImpactTimeline=timeline;
      pattern.runtimeImpactPending=true;
      const active=[...new Set(timeline.flatMap(event=>event.targetIndices||[]))];
      return {targets:active.map(index=>({index,result:'pending'})),indices:active,primary:finalPrimary};
    }
    function patternEmoji(pattern){
      const tags=new Set(pattern.tags||[]);
      return tags.has('fire')?'🔥':tags.has('ice')?'❄️':tags.has('water')?'💧':tags.has('thunder')?'⚡':tags.has('dragon')?'🐉':tags.has('poison')?'☠️':'💥';
    }
    function playPattern(patternId){
      clearPendingFlightTransition();
      const source=(HUNT_MONSTER_PATTERN_OVERRIDES[owner.selectedMonster.id]||[]).find(pattern=>pattern.id===patternId);
      if(!source)return;
      const pattern={...source,tags:[...(source.tags||[])],targeting:source.targeting?{...source.targeting}:null};
      const required=pattern.requiredState||(pattern.tags.includes('flight-only')?'airborne':null);
      if(required)applyState(required,true);else applyState(currentState,true);
      const selection=resolvePreviewTargets(pattern);
      updateTargetSelection(selection.indices,selection.primary);
      activePatternId=pattern.id;
      patternButtons.querySelectorAll('.pattern-btn').forEach(button=>{
        const running=button.dataset.pattern===pattern.id;button.classList.toggle('is-running',running);
        if(running)button.style.setProperty('--target',slotColors[selection.primary]);
      });
      document.documentElement.style.setProperty('--target',slotColors[selection.primary]);
      document.getElementById('run-readout').textContent=`${pattern.name} · ${targetMode==='auto'?'자동 ':''}${selection.indices.map(index=>index+1).join('·')}번`;
      labAudio?.playPattern(pattern,pattern.runtimeResolvedImpactTimeline||[]);
      animator.triggerMonsterAttack(pattern.type,patternEmoji(pattern),selection.targets,pattern.name,pattern);
      if(pattern.flightTransition==='takeoff'){
        pendingFlightTransitionTimer=setTimeout(()=>{
          pendingFlightTransitionTimer=null;
          applyState('airborne',true);
        },Math.max(1,Number(pattern.animationDurationMs||1800)));
      }else if(pattern.flightTransition==='land'){
        pendingFlightTransitionTimer=setTimeout(()=>{
          pendingFlightTransitionTimer=null;
          applyState('normal',true);
        },Math.max(1,Number(pattern.animationDurationMs||1800)));
      }
    }
    function showMonster(id){
      labAudio?.cancelPatternAudio();
      const monster=released.find(entry=>entry.id===id)||released[0];
      owner.selectedMonster={...monster};
      const image=document.getElementById('fight-monster-img');
      image.src=`../../img/monsters/${monster.filename||`${monster.id}.png`}`;image.alt=monster.nameKO;
      const combatName=document.getElementById('monster-name-text');
      if(combatName)combatName.textContent=monster.nameKO;
      const patterns=HUNT_MONSTER_PATTERN_OVERRIDES[monster.id]||[];
      document.getElementById('monster-summary').innerHTML=`<strong>${monster.nameKO}</strong>${monster.species||'분류 미상'} · 패턴 ${patterns.length}개`;
      patternButtons.replaceChildren(...patterns.map(pattern=>{
        const button=document.createElement('button');button.className='pattern-btn';button.dataset.pattern=pattern.id;
        button.dataset.requiredState=pattern.requiredState||'';button.dataset.flight=String(pattern.tags?.includes('flight-only')||false);
        button.textContent=pattern.name;button.title=`${pattern.id} · ${pattern.type}`;return button;
      }));
      activePatternId='';applyState('normal',true);updateTargetSelection([]);
      document.getElementById('run-readout').textContent='패턴을 선택하세요';
    }
    function renderCombatChrome(){
      const showcase=document.getElementById('monster-showcase-panel');
      showcase.insertAdjacentHTML('beforebegin',`
        <div id="game-hunt-top-panel" class="hunt-monster-vitals lab-vitals">
          <div class="game-hunt-monster-hp-container">
            <div class="game-hunt-monster-hp-wrapper">
              <div id="monster-hp-fill" style="width:82%"></div>
              <div class="monster-hp-center-text"><span id="monster-name-text">몬스터</span><span>14,760 / 18,000</span></div>
            </div>
            <div class="hunt-monster-atb-track" aria-label="몬스터 행동 게이지"><i></i></div>
          </div>
        </div>
        <div class="hunt-monster-aux-rail lab-aux">
          <section class="hunt-monster-aux-panel hunt-monster-parts-panel">
            <div class="lab-parts">
              <span class="lab-part"><span>🗿</span><b>머리</b></span>
              <span class="lab-part"><span>🪽</span><b>좌익</b></span>
              <span class="lab-part"><span>🪽</span><b>우익</b></span>
              <span class="lab-part"><span>➰</span><b>꼬리</b></span>
            </div>
          </section>
          <section class="hunt-monster-aux-panel hunt-monster-utility-panel">
            <div class="hunt-monster-corner-hud"><span class="hunt-monster-hud-chip">🛒 3</span><span class="hunt-monster-hud-chip">⏱ 07:32</span></div>
          </section>
        </div>`);

      const weaponSpecs=[
        {icon:'⚔️',hunter:'헌터 1',weapon:'대검',file:'great_sword.svg',item:'🧪 2  🪨 1',perk:'집중',atb:76,hp:88},
        {icon:'🛡️',hunter:'헌터 2',weapon:'랜스',file:'lance.svg',item:'🧪 3  🕸️ 1',perk:'가드 강화',atb:48,hp:100},
        {icon:'🎵',hunter:'헌터 3',weapon:'수렵피리',file:'hunting_horn.svg',item:'🧪 2  ✨ 1',perk:'피리 명인',atb:91,hp:72},
        {icon:'🏹',hunter:'헌터 4',weapon:'활',file:'bow.svg',item:'🧪 1  💥 1',perk:'체술',atb:64,hp:81}
      ];
      document.querySelectorAll('.game-hunt-weapon-card').forEach((card,index)=>{
        const spec=weaponSpecs[index];
        card.innerHTML=`
          <span class="hunter-slot">${index+1}</span>
          <div class="hunt-hunter-heading"><span class="hunt-hunter-personality">${spec.icon}</span><span class="hunt-hunter-name">${spec.hunter}</span></div>
          <div class="lab-sharpness"></div><div class="lab-special">🔥</div>
          <div class="game-hunt-weapon-img-container"><img class="game-hunt-weapon-img" src="../../img/weapons/${spec.file}" alt="${spec.weapon}"></div>
          <div class="hunt-combat-info">
            <div class="hunt-atb-row"><div class="hunt-atb-track"><i style="width:${spec.atb}%"></i></div></div>
            <div class="game-hunt-hp-wrapper"><div class="game-hunt-hp-fill" style="width:${spec.hp}%"></div><div class="game-hunt-hp-text">${spec.hp} / 100</div></div>
            <div class="hunt-item-list"><span>${spec.item}</span><span>💎 1  💨 1</span></div>
            <div class="lab-perks"><span class="lab-perk">${spec.icon} ${spec.perk}</span><span class="lab-perk">💪 공격 증폭</span></div>
            <div class="game-hunt-weapon-name">${spec.weapon}</div>
            <div class="lab-probabilities"><span class="hunt-probability-badge">🎯 90%</span><span class="hunt-probability-badge">💥 20%</span><span class="hunt-probability-badge">💨 15%</span></div>
          </div>`;
      });
    }
    function initialize(){
      renderCombatChrome();
      labAudio=new HuntMonsterPatternLabAudio({monsterProvider:()=>owner.selectedMonster});
      owner.onMonsterProjectileLaunchAudio=(monster,pattern)=>labAudio?.playProjectileLaunch(monster,pattern);
      labAudio.installToggle(document.querySelector('.target-panel'));
      monsterSelect.replaceChildren(...released.map(monster=>{
        const option=document.createElement('option');option.value=monster.id;option.textContent=monster.nameKO;return option;
      }));
      renderStateButtons();renderTargetButtons();
      const requested=new URLSearchParams(location.search).get('monster');
      monsterSelect.value=released.some(monster=>monster.id===requested)?requested:(released.find(monster=>monster.id==='tigrex')?.id||released[0]?.id);
      showMonster(monsterSelect.value);
    }
    monsterSelect.addEventListener('change',event=>showMonster(event.target.value));
    patternButtons.addEventListener('click',event=>{const button=event.target.closest('.pattern-btn');if(button)playPattern(button.dataset.pattern)});
    stateButtons.addEventListener('click',event=>{const button=event.target.closest('.state-btn');if(button)applyState(button.dataset.state)});
    targetButtons.addEventListener('click',event=>{const button=event.target.closest('.target-btn');if(!button)return;targetMode=button.dataset.target;updateTargetSelection([],null);if(activePatternId)playPattern(activePatternId)});
    addEventListener('load',initialize);
  </script>
</body>
</html>
