<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hunt Sword &amp; Shield Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 34%, #463621, #100d0a 70%); color: #fff; font-family: Arial, sans-serif; }
    main { height: 918px; padding: 48px 80px 48px; border-bottom: 2px dashed rgba(0,255,170,.5); }
    h1 { margin: 0; text-align: center; color: #f2d28c; font-size: 38px; letter-spacing: 3px; }
    p { margin: 16px 0 40px; text-align: center; color: #d8cbb6; font-size: 22px; }
    section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
    article { min-height: 520px; padding: 32px; border: 2px solid #a98242; border-radius: 24px; background: rgba(12,10,8,.88); box-shadow: 0 16px 36px #000; text-align: center; }
    img { width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 12px 16px #000); }
    h2 { margin: 20px 0 14px; color: #f3dba9; font-size: 30px; }
    .action { min-height: 98px; display: grid; place-items: center; border: 1px solid #c79e4d; border-radius: 14px; background: rgba(206,159,63,.17); color: #fff; font-size: 31px; font-weight: 800; }
    small { display: block; margin-top: 22px; color: #9dddc5; font-size: 18px; }
    footer { height: 162px; display: grid; place-items: center; background: rgba(0,0,0,.38); color: rgba(255,255,255,.65); font-size: 25px; }
  </style>
</head>
<body>
  <main data-testid="sns-flow-preview">
    <h1>한손검 · 화면에 남기는 결정타</h1>
    <p>일반 연속 베기·방패 연타는 조용히 진행하고, 전황이 바뀌는 네 순간만 크게 보여줍니다.</p>
    <section>
      <article><img src="../../img/weapons/sword_shield.svg" alt="한손검"><h2>방패 연타</h2><div class="action">일반 연계 · 텍스트 생략</div><small>내부: 방패치기 I → II → III → 가드베기</small></article>
      <article><img src="../../img/weapons/sword_shield.svg" alt="한손검"><h2>퍼펙트 가드</h2><div class="action">퍼펙트 가드!</div><small>막아낸 뒤 카운터베기 연계권 확보</small></article>
      <article><img src="../../img/weapons/sword_shield.svg" alt="한손검"><h2>카운터베기</h2><div class="action">카운터베기!</div><small>가드 성공에서만 이어지는 반격</small></article>
      <article><img src="../../img/weapons/sword_shield.svg" alt="한손검"><h2>공중 마무리</h2><div class="action">방패 내려찍기!</div><small>백스텝 → 모아 뛰어베기 이후의 선택지</small></article>
    </section>
  </main>
  <footer>OBS 채팅 전용 하단 15% · 전투 정보와 겹치지 않음</footer>
</body>
</html>
