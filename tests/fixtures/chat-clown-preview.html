<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>광대 채팅 버블 프리뷰</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: linear-gradient(#24334a, #101725); }
  </style>
</head>
<body>
  <div id="chat">
    <div class="chat-box visible" style="left:0%">
      <div class="chat-line visible"><div class="chat-line-bg"><div class="chat-line-inner">
        <div class="name-box"><span class="user-name">일반헌터</span></div>
        <span class="message">기존 채팅 간격 확인</span>
      </div></div></div>
    </div>
    <div class="chat-box visible" style="left:20%">
      <div class="chat-line visible"><div class="chat-line-bg"><div class="chat-line-inner chat-line-inner--clown">
        <div class="name-box"><span class="user-name">광대헌터</span></div>
        <span class="message message--clown" style="font-size:2.4em">사람이 죽는다구!</span>
      </div></div></div>
    </div>
    <div class="chat-box visible" style="left:40%">
      <div class="chat-line visible"><div class="chat-line-bg"><div class="chat-line-inner">
        <div class="name-box"><span class="user-name">옆자리</span></div>
        <span class="message">서로 겹치지 않음</span>
      </div></div></div>
    </div>
  </div>
</body>
</html>
